# Akun belajar forward. Bukan akun Binance/Testnet dan bukan persetujuan live.
demo:
  name: Belajar
  initial_cash: 1000
  database: data/learning.db
  interval: 1m
  warmup_bars: 500
  quote_seconds: 15
  repair_seconds: 300
  kill_switch_file: data/DEMO_STOP_TRADING
universe:
  mode: explicit
  symbols: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT]
  max_symbols: 30
  min_quote_volume: 5000000
  max_spread_bps: 20
strategy:
  name: rule_based_v1
backtest:
  fee_bps: 10
  slippage_bps: 5
risk:
  stop_mode: fixed
  stop_loss_pct: 3
  take_profit_pct: 6
  max_open_positions: 1
  risk_per_trade_pct: 1
  max_allocation_pct: 50
  max_position_notional_usdt: null
  daily_loss_limit_pct: 3
  max_drawdown_pct: 10
  cooldown_bars: 2
