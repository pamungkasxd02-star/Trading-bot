# Scalping forward eksperimental. Bukan strategi yang sudah terbukti profitable.
demo:
  name: Scalping Belajar
  database: data/learning-scalping.db
  initial_cash: 1000
  interval: 1m
  warmup_bars: 500
  quote_seconds: 5
  max_hold_seconds: 900
  repair_seconds: 300
  kill_switch_file: data/SCALPING_DEMO_STOP_TRADING
universe:
  mode: explicit
  symbols: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT]
  max_symbols: 30
  min_quote_volume: 10000000
  max_spread_bps: 10
strategy:
  name: rule_based_v1
  ema_fast: 9
  ema_slow: 21
  sma_trend: 50
  rsi_min: 45
  rsi_max: 68
  min_confirmations: 3
backtest:
  fee_bps: 10
  slippage_bps: 5
risk:
  stop_mode: fixed
  stop_loss_pct: 0.6
  take_profit_pct: 1.2
  risk_per_trade_pct: 0.25
  max_allocation_pct: 25
  max_open_positions: 1
  daily_loss_limit_pct: 3
  max_drawdown_pct: 10
  cooldown_bars: 2
runtime:
  max_signal_age_seconds: 30
  max_signal_price_drift_bps: 20
