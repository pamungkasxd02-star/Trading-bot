exchange:
  symbol: BTCUSDT
  interval: 4h
  testnet: true
  recv_window_ms: 5000
  rest_timeout_seconds: 15
data:
  database: data/testnet-multicoin.db
  history_months: 24
  research_database: data/research-multicoin.db
universe:
  mode: explicit
  symbols:
  - ADAUSDT
  - AVAXUSDT
  - BNBUSDT
  - BTCUSDT
  - ETHUSDT
  - LINKUSDT
  - SOLUSDT
  - XRPUSDT
  quote_asset: USDT
  max_symbols: 30
  min_quote_volume: 5000000.0
  max_spread_bps: 20.0
  min_history_days: 180
  excluded_bases:
  - USDC
  - FDUSD
  - TUSD
  - USDP
  - DAI
  - BUSD
  - EUR
  - USDE
strategy:
  name: adaptive_trend_v2
  ema_fast: 20
  ema_slow: 56
  sma_trend: 100
  rsi_period: 14
  rsi_min: 44.0
  rsi_max: 70.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  volume_period: 20
  min_confirmations: 3
  atr_period: 14
  adx_period: 14
  min_adx: 25.0
  min_atr_pct: 0.3
  max_atr_pct: 5.0
  min_relative_volume: 1.0
  daily_ema_period: 20
  pullback_rsi: 45.0
  pullback_lookback: 5
backtest:
  initial_cash: 20.0
  fee_bps: 10.0
  slippage_bps: 5.0
risk:
  risk_per_trade_pct: 1.0
  max_allocation_pct: 50.0
  max_position_notional_usdt: null
  market_order_buffer_pct: 0.5
  stop_loss_pct: 2.5
  take_profit_pct: 5.0
  daily_loss_limit_pct: 3.0
  max_drawdown_pct: 10.0
  max_open_positions: 1
  stop_mode: atr
  atr_stop_multiplier: 2.0
  atr_min_stop_pct: 1.0
  atr_max_stop_pct: 8.0
  reward_risk_ratio: 1.5
  cooldown_bars: 2
  max_candle_participation_pct: 0.1
gates:
  research_min_profit_factor: 1.05
  research_max_drawdown_pct: 10.0
  research_min_positive_windows_ratio: 0.75
  paper_min_days: 14
  paper_min_closed_trades: 20
  paper_min_profit_factor: 1.05
  paper_max_drawdown_pct: 10.0
  live_acknowledgement: I_ACCEPT_REAL_MONEY_RISK
runtime:
  database: data/runtime.db
  kill_switch_file: data/KILL_SWITCH
  session_stale_seconds: 180
  telegram_enabled: false
  history_bars: 1000
  streams_per_connection: 100
  signal_batch_seconds: 3.0
  max_signal_age_seconds: 120
  max_signal_price_drift_bps: 50.0
  supervision_seconds: 15
research:
  report_directory: reports/evaluation-v0_4/adaptive_selective
  train_months: 9
  test_months: 3
  min_train_trades: 10
  min_oos_trades: 20
  min_folds: 3
